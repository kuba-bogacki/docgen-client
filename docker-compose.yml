services:
  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ""
    container_name: web-frontend
    restart: unless-stopped
    networks:
      - for_company_network

  caddy-proxy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-frontend
    networks:
      - for_company_network

networks:
  for_company_network:
    external: true

volumes:
  caddy_data:
  caddy_config: