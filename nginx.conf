server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        return 404;
    }

    location ~* \.(?:php[0-9]?|phtml|phar|asp|aspx|jsp)(?:$|/) {
        return 404;
    }

    location ~* (?:~|\.bak|\.backup|\.old|\.orig|\.save|\.swp)$ {
        return 404;
    }

    location ~* ^/(?:service-account|sa|gcp-key|gcp-credentials|gcp-sa|credentials|google-credentials|google-key|application_default_credentials|firebase-adminsdk|firebase-key)\.json$ {
        return 404;
    }

    location ~* \.(?:env|bak|backup|old|orig|sql|sqlite|dump|ini|conf|log|ya?ml|zip|tar|gz|7z|swp)$ {
        deny all;
        return 404;
    }

    location = /server-status {
        deny all;
        return 404;
    }

    location = /actuator/env {
        deny all;
        return 404;
    }

    location = /actuator/heapdump {
        deny all;
        return 404;
    }

    location = /debug {
        deny all;
        return 404;
    }
}