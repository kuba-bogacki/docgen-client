server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        return 404;
    }

    location ~* \.(?:env|bak|backup|old|orig|sql|sqlite|dump|ini|conf|log|ya?ml|zip|tar|gz|7z|swp)$ {
        deny all;
        return 404;
    }

    location = /server-status {
        deny all;
        return 404;
    }

    location = /phpinfo.php {
        deny all;
        return 404;
    }

    location = /actuator/env {
        deny all;
        return 404;
    }

    location = /actuator/heapdump {
        deny all;
        return 404;
    }

    location = /debug {
        deny all;
        return 404;
    }
}